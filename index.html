</html><!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>J.A.R.V.I.S.</title>

<style>
body {
    margin: 0;
    background: #02070b;
    color: #7ddcff;
    font-family: Arial, sans-serif;
    text-align: center;
}

.container {
    padding: 35px 20px;
}

h1 {
    letter-spacing: 8px;
    font-size: 30px;
}

.status {
    font-size: 14px;
    color: #8ff0ff;
    margin-bottom: 35px;
}

.arc {
    width: 190px;
    height: 190px;
    margin: auto;
    border-radius: 50%;
    border: 3px solid #4cc9f0;
    box-shadow: 0 0 30px #168aad;
    display: flex;
    justify-content: center;
    align-items: center;
}

.core {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    background: #bff5ff;
    box-shadow: 0 0 35px #4cc9f0;
}

button {
    margin-top: 35px;
    width: 180px;
    height: 60px;
    border-radius: 30px;
    border: 2px solid #4cc9f0;
    background: #06141d;
    color: #9eeeff;
    font-size: 18px;
}

button:active {
    background: #123544;
}

#output {
    margin: 30px auto;
    max-width: 500px;
    font-size: 17px;
    line-height: 1.5;
}

.listening {
    animation: pulse 1s infinite;
}

@keyframes pulse {
    50% {
        opacity: .4;
    }
}
</style>
</head>

<body>

<div class="container">

<h1>J.A.R.V.I.S.</h1>

<div class="status" id="status">
SYSTEM ONLINE
</div>

<div class="arc">
    <div class="core"></div>
</div>

<div id="output">
Good evening. JARVIS is ready.
</div>

<button id="talk">
🎙️ TALK TO JARVIS
</button>

</div>

<script>

const button = document.getElementById("talk");
const output = document.getElementById("output");
const status = document.getElementById("status");

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

if (!SpeechRecognition) {

    output.innerText =
        "Voice recognition isn't supported in this browser.";

} else {

    const recognition = new SpeechRecognition();

    recognition.lang = "en-AU";
    recognition.continuous = false;
    recognition.interimResults = false;

    button.onclick = () => {

        status.innerText = "LISTENING...";
        status.classList.add("listening");

        recognition.start();

    };

    recognition.onresult = (event) => {

        const command =
            event.results[0][0].transcript;

        output.innerText =
            "You: " + command;

        respond(command);

    };

    recognition.onerror = () => {

        status.innerText = "SYSTEM ONLINE";
        status.classList.remove("listening");

        output.innerText =
            "I couldn't hear that. Try again.";

    };

    recognition.onend = () => {

        status.innerText = "SYSTEM ONLINE";
        status.classList.remove("listening");

    };
}

function respond(command) {

    command = command.toLowerCase();

    let response;

    if (command.includes("hello") ||
        command.includes("hi")) {

        response =
            "Hello. JARVIS is online and ready.";

    } else if (command.includes("your name")) {

        response =
            "My name is JARVIS. Just A Rather Very Intelligent System.";

    } else if (command.includes("time")) {

        response =
            "The current time is " +
            new Date().toLocaleTimeString("en-AU");

    } else if (command.includes("date")) {

        response =
            "Today is " +
            new Date().toLocaleDateString("en-AU");

    } else {

        response =
            "I heard you say: " + command +
            ". My AI core isn't connected yet.";

    }

    output.innerText = response;

    speak(response);
}

function speak(text) {

    const speech =
        new SpeechSynthesisUtterance(text);

    speech.lang = "en-AU";
    speech.rate = 0.9;
    speech.pitch = 0.8;

    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(speech);
}

</script>

</body>
</html>
