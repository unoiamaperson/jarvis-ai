</html><!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>J.A.R.V.I.S.</title>

<style>
body {
    margin: 0;
    background: #02070b;
    color: #7ddcff;
    font-family: Arial, sans-serif;
    text-align: center;
}

.container {
    padding: 35px 20px;
}

h1 {
    letter-spacing: 8px;
    font-size: 30px;
}

.status {
    font-size: 14px;
    color: #8ff0ff;
    margin-bottom: 35px;
}

.arc {
    width: 190px;
    height: 190px;
    margin: auto;
    border-radius: 50%;
    border: 3px solid #4cc9f0;
    box-shadow: 0 0 30px #168aad;
    display: flex;
    justify-content: center;
    align-items: center;
}

.core {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    background: #bff5ff;
    box-shadow: 0 0 35px #4cc9f0;
}

button {
    margin-top: 35px;
    width: 180px;
    height: 60px;
    border-radius: 30px;
    border: 2px solid #4cc9f0;
    background: #06141d;
    color: #9eeeff;
    font-size: 18px;
}

button:active {
    background: #123544;
}

#output {
    margin: 30px auto;
    max-width: 500px;
    font-size: 17px;
    line-height: 1.5;
}

.listening {
    animation: pulse 1s infinite;
}

@keyframes pulse {
    50% {
        opacity: .4;
    }
}
</style>
</head>

<body>

<div class="container">

<h1>J.A.R.V.I.S.</h1>

<div class="status" id="status">
SYSTEM ONLINE
</div>

<div class="arc">
    <div class="core"></div>
</div>

<div id="output">
Good evening. JARVIS is ready.
</div>

<button id="talk">
🎙️ TALK TO JARVIS
</button>

</div>

<script>
async function sendMessage() {
  const input = document.getElementById("message");
  const chat = document.getElementById("chat");

  const text = input.value.trim();
  if (!text) return;

  chat.innerHTML += `<div class="user">You: ${text}</div>`;
  input.value = "";

  const res = await fetch("https://openaiworker.f5zcftzj8k.workers.dev", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ message: text })
  });

  const data = await res.json();

  chat.innerHTML += `<div class="bot">AI: ${data.reply}</div>`;
  chat.scrollTop = chat.scrollHeight;
}
</script>




</body>
</html>
